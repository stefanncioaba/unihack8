spring.application.name=backend

# Secrets and per-machine values (database, Supabase JWT secret, Gemini key) live in
# application-local.properties, loaded by running with the "local" profile (see DOCS.md).

# --- Database -----------------------------------------------------------------
# The schema is owned by Supabase migrations (supabase/migrations); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Supabase's session pooler allows few connections on the free plan.
spring.datasource.hikari.maximum-pool-size=5

# --- JSON ---------------------------------------------------------------------
# Times are sent as ISO-8601 strings in UTC (docs/API.md -> Conventions).
spring.jackson.time-zone=UTC

# --- Server -------------------------------------------------------------------
# Listen on all network interfaces so phones on the same Wi-Fi can reach the laptop.
server.address=0.0.0.0
server.port=8080
