# Test settings: never touch the real Supabase database or real secrets (PLAN 3.5).

spring.application.name=backend-test

# In-memory H2 in PostgreSQL mode instead of Supabase. Tables are created from the entities.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Fake Supabase settings; tests sign their own tokens with this secret (see JwtTestTokens).
supabase.url=https://test-project.supabase.co
supabase.jwt-secret=test-secret-for-automated-tests-only-0123456789

spring.jackson.time-zone=UTC

# The reliability no-show job (PLAN 6.3) is off in tests; tests call NoShowService directly.
reliability.no-show-job.enabled=false

# The review settlement job is off in tests; tests call ReviewSettlementService directly.
reviews.settlement-job.enabled=false

# News (PLAN 26): no background reads of the real news sites in tests.
news.warm-up=false
